[package]
name = "raven_backend_kwin"
version = "3.2.0"
edition = "2021"
description = "Adaptador de backend para el compositor KWin (KDE Plasma) mediante zbus y protocolos nativos"
license = "GPL-3.0"

[dependencies]
raven_core = { path = "../raven_core" }
async-trait = "0.1"
tokio = { version = "1.37", default-features = false, features = ["rt", "sync", "time"] }
zbus = { version = "4.1", default-features = false, features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
futures = "0.3"
