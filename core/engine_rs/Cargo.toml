[package]
name = "raven_engine"
version = "3.2.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
zbus = { version = "4.1", default-features = false, features = ["tokio"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
raven_core = { path = "../../crates/raven_core" }